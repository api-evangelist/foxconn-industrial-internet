description: 'Foxconn Industrial Internet Co., Ltd. (FII, 工业富联) is a Shanghai Stock Exchange-listed
  subsidiary of Hon Hai Precision Industry (Foxconn), headquartered in Shenzhen, China. It is a
  smart-manufacturing and industrial-internet company producing cloud computing infrastructure and AI
  servers, communication and networking equipment, and precision tooling, and it offers factory-automation,
  lighthouse-factory, and industrial-internet platform services for global electronics OEMs. FII operates
  as a contract manufacturer and industrial platform rather than a public API provider: it publishes no
  public developer API, OpenAPI, SDK, or developer portal. This profile tracks the company''s corporate
  identity in the API Evangelist network; there is no API artifact surface to enrich.'
